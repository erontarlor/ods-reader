# This workflow will do a clean installation of node dependencies, cache/restore them and run a coverage test
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Coverage

on:
  push:
    branches: [ "main" ]

jobs:
  coverage:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate coverage
      run: npm run coverage

    - name: Generate coverage badge
      run: |
        node <<'EOF'
        const fs = require('fs');
        const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
        const coverage = summary.total.lines.pct;
        const badge = {
          schemaVersion: 1,
          label: 'coverage',
          message: `${coverage}%`,
          color: 'brightgreen'
        };
        fs.writeFileSync('/tmp/coverage-badge.json', JSON.stringify(badge, null, 2)+'\n');
        EOF

    - name: Publish coverage badge
      run: |
        git fetch origin coverage:coverage
        git checkout coverage
        rm -rf coverage node_modules
        cp /tmp/coverage-badge.json coverage-badge.json
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add coverage-badge.json
        git commit -m "Update coverage badge"
        git push origin coverage
