# This workflow will do a clean checkout, increase the version number, create the new documentation, push the change, tag the changes, perform a GitHub release and publish the new version to NPM
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Release

on:
  workflow_dispatch:
    inputs:
      versionSelection:
        description: "Select version to increase (major, minor, patch)"
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch

      releaseDescription:
        description: "Enter release note"
        required: true
        type: string
        default: |
          ## Major|Feature|Patch release

          What has changed?

          ### Features
          - One
          - Two
          - Three

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: npm ci

      - name: Configure User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Increase Version
        run: |
          npm version ${{ github.event.inputs.versionSelection }} --no-git-tag-version

      - name: Extract Version
        id: version
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $VERSION"

      - name: Build Documentation
        run: npm run docs

      - name: Commit Release
        run: |
          git add package.json package-lock.json docs
          git commit -m "Release v${{ steps.version.outputs.version }}"

      - name: Create Git Tag
        run: |
          git tag -a "v${{ steps.version.outputs.version }}" \
            -m "Release v${{ steps.version.outputs.version }}"

      - name: Push Release
        run: |
          git push origin main
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: ${{ github.event.inputs.releaseDescription }}
          generate_release_notes: false
          draft: false
          prerelease: false

      - name: Publish to NPM
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
